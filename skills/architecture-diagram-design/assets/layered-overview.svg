<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">边缘助手：分层架构</title>
  <desc id="description">假设性示例，不代表具体产品实现。四层依次为开发支持、应用与服务、运行环境、终端与网络。蓝色层标签对应右侧白色组件卡片；组件排列不表示调用或部署依赖。</desc>
  <defs>
    <linearGradient id="page-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <linearGradient id="layer-background" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#edf4ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .page-title { fill: #152437; font-size: 40px; font-weight: 700; }
      .subtitle { fill: #66768b; font-size: 21px; }
      .layer-frame { fill: url(#layer-background); stroke: #7098ef; stroke-width: 1.5; }
      .layer-label { fill: #3266d9; }
      .layer-number { fill: #dce8ff; font-size: 19px; font-weight: 500; text-anchor: middle; }
      .layer-name { fill: #ffffff; font-size: 28px; font-weight: 700; text-anchor: middle; }
      .component { fill: #ffffff; stroke: #86a8ed; stroke-width: 1.5; }
      .component-name { fill: #20374f; font-size: 24px; font-weight: 600; text-anchor: middle; }
      .component-detail { fill: #64748b; font-size: 20px; text-anchor: middle; }
      .note { fill: #66768b; font-size: 20px; }
      .credit { fill: #536579; font-size: 20px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#page-background)"/>
  <text x="72" y="78" class="page-title">边缘助手：分层架构</text>
  <text x="74" y="118" class="subtitle">假设性示例，不代表具体产品实现</text>
  <rect x="1326" y="49" width="202" height="43" rx="21.5" fill="#e8f0ff"/>
  <text x="1427" y="77" fill="#3266d9" font-size="20" font-weight="600" text-anchor="middle">分层总览</text>

  <!-- Layer 4: development support is not an online request stage. -->
  <g id="development-support" data-layer="4">
    <rect x="64" y="162" width="1472" height="134" rx="18" class="layer-frame"/>
    <rect x="80" y="178" width="234" height="102" rx="12" class="layer-label"/>
    <text x="197" y="215" class="layer-number">第 4 层</text>
    <text x="197" y="252" class="layer-name">开发支持</text>
    <g id="documentation" data-component="documentation">
      <rect x="334" y="178" width="376" height="102" rx="12" class="component"/>
      <text x="522" y="220" class="component-name">文档</text>
      <text x="522" y="255" class="component-detail">接口规范 · 开发指南 · 示例</text>
    </g>
    <g id="debugging-tools" data-component="debugging-tools">
      <rect x="730" y="178" width="376" height="102" rx="12" class="component"/>
      <text x="918" y="220" class="component-name">调试工具</text>
      <text x="918" y="255" class="component-detail">运行验证 · 日志检查 · 排错</text>
    </g>
    <g id="community" data-component="community">
      <rect x="1126" y="178" width="378" height="102" rx="12" class="component"/>
      <text x="1315" y="220" class="component-name">社区</text>
      <text x="1315" y="255" class="component-detail">经验交流 · 问题反馈 · 协作</text>
    </g>
  </g>

  <g id="applications-and-services" data-layer="3">
    <rect x="64" y="312" width="1472" height="134" rx="18" class="layer-frame"/>
    <rect x="80" y="328" width="234" height="102" rx="12" class="layer-label"/>
    <text x="197" y="365" class="layer-number">第 3 层</text>
    <text x="197" y="402" class="layer-name">应用与服务</text>
    <g id="parsing" data-component="parsing">
      <rect x="334" y="328" width="376" height="102" rx="12" class="component"/>
      <text x="522" y="370" class="component-name">解析</text>
      <text x="522" y="405" class="component-detail">解释请求 · 形成结构化输入</text>
    </g>
    <g id="business-orchestration" data-component="business-orchestration">
      <rect x="730" y="328" width="376" height="102" rx="12" class="component"/>
      <text x="918" y="370" class="component-name">业务编排</text>
      <text x="918" y="405" class="component-detail">执行规则 · 协调任务与动作</text>
    </g>
    <g id="result-generation" data-component="result-generation">
      <rect x="1126" y="328" width="378" height="102" rx="12" class="component"/>
      <text x="1315" y="370" class="component-name">结果生成</text>
      <text x="1315" y="405" class="component-detail">组织输出 · 生成可展示结果</text>
    </g>
  </g>

  <g id="runtime-environments" data-layer="2">
    <rect x="64" y="462" width="1472" height="134" rx="18" class="layer-frame"/>
    <rect x="80" y="478" width="234" height="102" rx="12" class="layer-label"/>
    <text x="197" y="515" class="layer-number">第 2 层</text>
    <text x="197" y="552" class="layer-name">运行环境</text>
    <g id="device-runtime" data-component="device-runtime">
      <rect x="334" y="478" width="575" height="102" rx="12" class="component"/>
      <text x="621.5" y="520" class="component-name">设备运行时</text>
      <text x="621.5" y="555" class="component-detail">输入整理 · 设备接口 · 交互调度</text>
    </g>
    <g id="gateway-runtime" data-component="gateway-runtime">
      <rect x="929" y="478" width="575" height="102" rx="12" class="component"/>
      <text x="1216.5" y="520" class="component-name">网关运行时</text>
      <text x="1216.5" y="555" class="component-detail">连接管理 · 消息转发 · 状态管理</text>
    </g>
  </g>

  <g id="terminals-and-network" data-layer="1">
    <rect x="64" y="612" width="1472" height="134" rx="18" class="layer-frame"/>
    <rect x="80" y="628" width="234" height="102" rx="12" class="layer-label"/>
    <text x="197" y="665" class="layer-number">第 1 层</text>
    <text x="197" y="702" class="layer-name">终端与网络</text>
    <g id="smart-terminal" data-component="smart-terminal">
      <rect x="334" y="628" width="575" height="102" rx="12" class="component"/>
      <text x="621.5" y="670" class="component-name">智能终端</text>
      <text x="621.5" y="705" class="component-detail">采集输入 · 呈现结果 · 提供交互</text>
    </g>
    <g id="network-gateway" data-component="network-gateway">
      <rect x="929" y="628" width="575" height="102" rx="12" class="component"/>
      <text x="1216.5" y="670" class="component-name">网络网关</text>
      <text x="1216.5" y="705" class="component-detail">承载终端与应用服务之间的网络通信</text>
    </g>
  </g>

  <text x="74" y="794" class="note">分层说明职责边界；同层组件的排列不表示调用或部署依赖。</text>
  <text x="800" y="856" class="credit">感谢 成都常顺鑫</text>
</svg>
